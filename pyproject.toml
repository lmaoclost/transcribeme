[project]
name = "transcribeme"
version = "0.3.0"
description = "Queue YouTube/direct URLs and file uploads and transcribe to pt-BR with faster-whisper."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sean Dearnaley" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "yt-dlp>=2024.10.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.30",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
# NOTE: torch is installed separately from the CPU-only index (see Dockerfile.backend.ml);
# keep it out of this extra so the default index never pulls the CUDA bundle.
ml = [
  "faster-whisper>=1.1.0",
  "transformers>=4.40.0",
  "sentencepiece>=0.1.99",
  "accelerate>=0.27.0",
  "sacremoses>=0.0.53",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.12.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
