name: transcribeme

networks:
  transcribeme_network:
    name: transcribeme_network
    driver: bridge
    ipam: {}
    external: false

services:
  api:
    cpu_shares: 90
    command:
      - uvicorn
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    container_name: transcribeme-api
    depends_on:
      redis:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      - PYTHONPATH=/app
      - QTUBE_DATABASE_URL=sqlite:///./data/qtube.db
      - QTUBE_DOWNLOADS_DIR=/app/downloads
      - QTUBE_MODELS_DIR=/app/models
      - QTUBE_WHISPER_MODEL=small
      - QTUBE_TRANSCRIPTION_DEVICE=cpu
      - QTUBE_TRANSCRIPTION_COMPUTE_TYPE=int8
      - QTUBE_CLEANUP_DAYS=7
      - QTUBE_TRANSLATION_MODEL=facebook/nllb-200-distilled-600M
      - QTUBE_TRANSCRIPTION_SPEED=1.5
    image: ghcr.io/lmaoclost/transcribeme-backend:latest
    networks:
      - transcribeme_network
    ports:
      - mode: ingress
        target: 8000
        published: "8016"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/transcribeme/data
        target: /app/data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/downloads
        target: /app/downloads
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/models
        target: /app/models
        bind:
          create_host_path: true

  celery_transcription:
    cpu_shares: 90
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency
      - "1"
      - -Q
      - transcription_queue
    container_name: transcribeme-worker-transcription
    deploy:
      resources:
        limits:
          memory: 6GB
          cpus: "2.00"
        reservations:
          memory: 1GB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      - PYTHONPATH=/app
      - QTUBE_DATABASE_URL=sqlite:///./data/qtube.db
      - QTUBE_DOWNLOADS_DIR=/app/downloads
      - QTUBE_MODELS_DIR=/app/models
      - QTUBE_WHISPER_MODEL=small
      - QTUBE_TRANSCRIPTION_DEVICE=cpu
      - QTUBE_TRANSCRIPTION_COMPUTE_TYPE=int8
      - QTUBE_TRANSLATION_MODEL=facebook/nllb-200-distilled-600M
      - QTUBE_TRANSCRIPTION_SPEED=1.5
    image: ghcr.io/lmaoclost/transcribeme-backend:latest
    networks:
      - transcribeme_network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
        required: true
    volumes:
      - type: bind
        source: /DATA/AppData/transcribeme/downloads
        target: /app/downloads
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/models
        target: /app/models
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/data
        target: /app/data
        bind:
          create_host_path: true

  celery_download:
    cpu_shares: 90
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency
      - "1"
      - -Q
      - download_queue
    container_name: transcribeme-worker-download
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      - PYTHONPATH=/app
      - QTUBE_DATABASE_URL=sqlite:///./data/qtube.db
      - QTUBE_DOWNLOADS_DIR=/app/downloads
    image: ghcr.io/lmaoclost/transcribeme-backend:latest
    networks:
      - transcribeme_network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
        required: true
    volumes:
      - type: bind
        source: /DATA/AppData/transcribeme/downloads
        target: /app/downloads
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/data
        target: /app/data
        bind:
          create_host_path: true

  celery_beat:
    cpu_shares: 90
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=info
    container_name: transcribeme-beat
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "0.50"
        reservations:
          memory: 128MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      - PYTHONPATH=/app
      - QTUBE_DATABASE_URL=sqlite:///./data/qtube.db
      - QTUBE_DOWNLOADS_DIR=/app/downloads
      - QTUBE_CLEANUP_DAYS=7
    image: ghcr.io/lmaoclost/transcribeme-backend:latest
    networks:
      - transcribeme_network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
        required: true
    volumes:
      - type: bind
        source: /DATA/AppData/transcribeme/downloads
        target: /app/downloads
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/transcribeme/data
        target: /app/data
        bind:
          create_host_path: true

  redis:
    cpu_shares: 90
    command: []
    container_name: transcribeme-redis
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: "0.50"
        reservations:
          memory: 64MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    image: redis:7-alpine
    networks:
      - transcribeme_network
    restart: always
    volumes:
      - type: volume
        source: redis_data
        target: /data

  frontend:
    cpu_shares: 90
    command:
      - yarn
      - start
    container_name: transcribeme-frontend
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: "0.50"
        reservations:
          memory: 128MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      - NODE_ENV=production
    image: ghcr.io/lmaoclost/transcribeme-frontend:latest
    networks:
      - transcribeme_network
    ports:
      - mode: ingress
        target: 3000
        published: "3016"
        protocol: tcp
    restart: unless-stopped
    volumes: []

volumes:
  redis_data:

x-casaos:
  architectures:
    - amd64
  author: lmaoclost
  category: BigBearCasaOS
  description:
    en_us: Queue YouTube/URL/uploads, transcribe + translate (whisper + NLLB), CPU ZimaOS ready.
  developer: lmaoclost
  hostname: ""
  index: /
  is_uncontrolled: false
  main: frontend
  port_map: "3016"
  scheme: http
  store_app_id: transcribeme
  tagline:
    en_us: Transcribeme
  thumbnail: ""
  title:
    custom: Transcribeme
    en_us: Transcribeme
